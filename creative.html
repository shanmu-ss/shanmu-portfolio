<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>PracLearn — Animated Landing</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #f9fafb;
      background: linear-gradient(120deg, #0f172a, #1d4ed8, #7c3aed);
      background-size: 300% 300%;
      animation: bg-shift 18s ease-in-out infinite;
      overflow: hidden;
    }

    .hero {
      position: relative;
      max-width: 720px;
      padding: 3rem 3.5rem;
      border-radius: 24px;
      background: rgba(15, 23, 42, 0.78);
      box-shadow: 0 30px 80px rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(18px);
      overflow: hidden;
      animation: card-fade-up 1.2s ease-out forwards;
      transform: translateY(30px);
      opacity: 0;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      padding: 0.3rem 0.8rem;
      border-radius: 999px;
      background: rgba(56, 189, 248, 0.12);
      color: #a5f3fc;
      font-size: 0.8rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .badge-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #22d3ee;
      box-shadow: 0 0 10px rgba(34, 211, 238, 0.9);
      animation: pulse-dot 1.6s ease-out infinite;
    }

    h1 {
      margin-top: 1.2rem;
      font-size: clamp(2.4rem, 4vw, 3.2rem);
      line-height: 1.1;
    }

    h1 span.gradient {
      background: linear-gradient(120deg, #38bdf8, #a855f7, #f97316);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    p.subtitle {
      margin-top: 0.9rem;
      font-size: 1rem;
      line-height: 1.6;
      color: #e5e7eb;
      max-width: 32rem;
      opacity: 0.85;
    }

    .actions {
      margin-top: 1.8rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.9rem;
    }

    .btn-primary,
    .btn-ghost {
      border-radius: 999px;
      padding: 0.7rem 1.5rem;
      font-size: 0.95rem;
      border: 1px solid transparent;
      cursor: pointer;
      transition: transform 0.15s ease-out, box-shadow 0.15s ease-out, background 0.15s ease-out, border-color 0.15s ease-out;
    }

    .btn-primary {
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      color: white;
      box-shadow: 0 18px 40px rgba(59, 130, 246, 0.55);
    }

    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 24px 60px rgba(59, 130, 246, 0.7);
    }

    .btn-ghost {
      background: transparent;
      color: #e5e7eb;
      border-color: rgba(148, 163, 184, 0.7);
    }

    .btn-ghost:hover {
      background: rgba(15, 23, 42, 0.9);
      transform: translateY(-1px);
    }

    .meta {
      margin-top: 1.6rem;
      display: flex;
      flex-wrap: wrap;
      gap: 1.2rem;
      font-size: 0.85rem;
      color: #9ca3af;
    }

    .meta strong {
      color: #e5e7eb;
      font-weight: 600;
    }

    /* Floating shapes */
    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(0.5px);
      opacity: 0.55;
      mix-blend-mode: screen;
      animation: float-orb 18s ease-in-out infinite alternate;
      pointer-events: none;
    }

    .orb.one {
      width: 160px;
      height: 160px;
      background: radial-gradient(circle at 30% 30%, #38bdf8, transparent 65%);
      top: -40px;
      right: -60px;
      animation-delay: -2s;
    }

    .orb.two {
      width: 220px;
      height: 220px;
      background: radial-gradient(circle at 70% 30%, #a855f7, transparent 65%);
      bottom: -90px;
      left: -70px;
      animation-delay: -6s;
    }

    .orb.three {
      width: 120px;
      height: 120px;
      background: radial-gradient(circle at 50% 50%, #f97316, transparent 60%);
      top: 50%;
      left: 55%;
      transform: translate(-50%, -50%);
      opacity: 0.4;
      animation-duration: 22s;
    }

    @keyframes bg-shift {
      0% {
        background-position: 0% 50%;
      }
      50% {
        background-position: 100% 50%;
      }
      100% {
        background-position: 0% 50%;
      }
    }

    @keyframes card-fade-up {
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    @keyframes float-orb {
      0% {
        transform: translate3d(0, 0, 0) scale(1);
      }
      50% {
        transform: translate3d(20px, -10px, 0) scale(1.05);
      }
      100% {
        transform: translate3d(-10px, 20px, 0) scale(0.96);
      }
    }

    @keyframes pulse-dot {
      0% {
        transform: scale(1);
        opacity: 1;
      }
      70% {
        transform: scale(1.8);
        opacity: 0;
      }
      100% {
        transform: scale(1);
        opacity: 0;
      }
    }

    @media (max-width: 640px) {
      .hero {
        padding: 2rem 1.5rem;
        margin: 1rem;
      }
      h1 {
        font-size: 1.9rem;
      }
      .meta {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <main class="hero">
    <div class="orb one"></div>
    <div class="orb two"></div>
    <div class="orb three"></div>

    <span class="badge">
      <span class="badge-dot"></span>
      Live preview
    </span>

    <h1>
      Build cloud labs
      <span class="gradient">faster</span>.
    </h1>

    <p class="subtitle">
      A tiny one‑page playground to test HTML, CSS, JavaScript, and your Terraform‑powered cloud ideas — with a smooth animated background to keep things interesting.
    </p>

    <div class="actions">
      <button class="btn-primary">Get started</button>
      <button class="btn-ghost">View source</button>
    </div>

    <div class="meta">
      <div><strong>Zero JS</strong> — pure HTML &amp; CSS</div>
      <div><strong>Animated</strong> gradient + floating orbs</div>
      <div><strong>Responsive</strong> for mobile &amp; desktop</div>
    </div>
  </main>
</body>
</html>
